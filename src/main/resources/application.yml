server:
  port: 8086
  servlet:
    context-path: /app-server

spring:
  application:
    name: sun-moon-java-platform-app-server
  datasource:
    url: jdbc:postgresql://localhost:5432/app_server
    username: sunmoon
    password: sunmoon_dev_pw
  flyway:
    enabled: true
    # 이 데이터베이스는 비어 있지 않습니다 — fdw 외부 테이블과 뷰가
    # 이미 들어 있습니다(server/db/app-server-fdw.sql). baseline 이
    # 없으면 Flyway 가 "비어 있지 않은 schema"라며 기동을 거부합니다.
    #
    # Flyway 는 자기가 만든 표만 압니다. 외부 테이블과 뷰는 여전히
    # 그 스크립트의 것이고, 마이그레이션이 건드리지 않습니다.
    baseline-on-migrate: true
    baseline-version: 0

# 이 데이터베이스에는 두 종류가 섞여 있습니다.
#
#   - APP 주문 원장 (app_order_*) — 이 서비스가 소유하고 Flyway 가 관리
#   - BO 마스터를 가리키는 postgres_fdw 외부 테이블과 그 위의 뷰
#     — server/db/app-server-fdw.sql 이 만듭니다 (확장 설치와 역할
#       생성에 superuser가 필요해서 애플리케이션이 못 합니다)
#
# Flyway 는 앞의 것만 압니다. 뒤의 것은 마이그레이션이 건드리지 않고,
# 그래서 fdw 스크립트를 다시 돌려도 주문 원장은 무사합니다.

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

# 이 서버가 HTTP로 읽는 유일한 곳 — 매장 영업 상태(개점/마감)입니다.
# 기준 정보가 아니라 운영 상태라 소유자(OMS)에게 직접 물어봅니다.
# BO 마스터는 여기 없습니다 — postgres_fdw 뷰로 읽습니다 (ADR-0008).
#
# 배포 서버는 컨테이너가 전부 --network host 라 localhost 이고,
# Order 는 자기 /order context-path 를 달고 있습니다.
app-server:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083/order}
