server:
  port: 8086
  servlet:
    context-path: /app-server

spring:
  application:
    name: sun-moon-java-platform-app-server
  datasource:
    url: jdbc:postgresql://localhost:5432/app_server
    username: sunmoon
    password: sunmoon_dev_pw

# app_server 데이터베이스에는 이 서버가 소유한 표가 아직 없습니다. 지금 들어
# 있는 것은 BO 마스터를 가리키는 postgres_fdw 외부 테이블과 그 위의 뷰뿐이고,
# 그것은 애플리케이션이 아니라 server/db/app-server-fdw.sql 이 만듭니다
# (확장 설치와 역할 생성에 superuser가 필요합니다).
#
# 그래서 spring.sql.init 이 없습니다 — 기동할 때마다 도는 schema.sql 이
# 외부 테이블을 건드릴 일은 없어야 합니다. App·QR 마스터 표가 생기면 그때
# 이 서비스 소유의 schema.sql 이 함께 들어옵니다.

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

# 이 서버가 HTTP로 읽는 유일한 곳 — 매장 영업 상태(개점/마감)입니다.
# 기준 정보가 아니라 운영 상태라 소유자(OMS)에게 직접 물어봅니다.
# BO 마스터는 여기 없습니다 — postgres_fdw 뷰로 읽습니다 (ADR-0008).
#
# 배포 서버는 컨테이너가 전부 --network host 라 localhost 이고,
# Order 는 자기 /order context-path 를 달고 있습니다.
app-server:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083/order}
